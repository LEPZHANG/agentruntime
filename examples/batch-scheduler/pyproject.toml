[project]
name = "arbiter-example-batch-scheduler"
version = "0.1.0"
description = "Blueprint E — nightly scheduled agent producing a structured daily digest."
requires-python = ">=3.10"
dependencies = [
    "arbiter",
]

[tool.uv.sources]
arbiter = { path = "../..", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
