[project]
name = "arbiter-example-tool-injection"
version = "0.1.0"
description = "Inject Jina-backed web_fetch (construction-time) and web_search (runtime) into an embedded Arbiter."
requires-python = ">=3.10"
dependencies = [
    "arbiter",
    "httpx>=0.25.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[tool.uv.sources]
arbiter = { path = "../..", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
