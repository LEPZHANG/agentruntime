[project]
name = "arbiter-example-pytest-fixture"
version = "0.1.0"
description = "Drop-in pytest fixture: one Arbiter per test, fake LLM, no API key."
requires-python = ">=3.10"
dependencies = [
    "arbiter",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[tool.uv.sources]
arbiter = { path = "../..", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
