[project]
name = "arbiter-example-protocol-injection"
version = "0.1.0"
description = "Inject all four arbiter.host.protocols (FileSystem / ShellExecutor / MCPRegistry / MemoryStore) into an embedded Arbiter."
requires-python = ">=3.10"
dependencies = [
    "arbiter",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[tool.uv.sources]
arbiter = { path = "../..", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
